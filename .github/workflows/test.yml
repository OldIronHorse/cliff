# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "trunk" branch
  push:
    branches: [ "trunk" ]
  pull_request:
    branches: [ "trunk" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  test:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v7
      - name: Install Roc
        uses: roc-lang/setup-roc@v0.3.0
        with:
          version: nightly-new-compiler
          #nightly-tag: pin version here
      - name: Check the Roc version
        run: roc --version
      - name: Test library
        run: roc test package/main.roc
      - name: Test grep CLI clone
        run: roc test examples/grep.roc
      - name: Test git CLI clone
        run: roc test examples/git.roc
