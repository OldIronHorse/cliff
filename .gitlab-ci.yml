stages:          # List of stages for jobs, and their order of execution
  - test
  - build
  - deploy

.roc: &roc_template
  before_script:
    - curl -fL -O https://github.com/roc-lang/nightlies/releases/download/nightly-2026-10-06-c34079d/roc_nightly-linux_x86_64-2026-10-06-c34079d.tar.gz
    - tar zxf roc_nightly-linux_x86_64-2026-10-06-c34079d.tar.gz
    - mv roc_nightly-linux_x86_64-2026-10-06-c34079d/roc .

unit-test-job:   # This job runs in the test stage.
  <<: *roc_template
  stage: test    # It only starts when the job in the build stage completes successfully.
  script:
    - ./roc test App.roc

lint-test-job:   # This job also runs in the test stage.
  <<: *roc_template
  stage: test    # It can run at the same time as unit-test-job (in parallel).
  script:
    - ./roc check App.roc

deploy-job:      # This job runs in the deploy stage.
  <<: *roc_template
  stage: deploy  # It only runs when *both* jobs in the test stage complete successfully.
  only:
    - tags
  script:
    - ./roc bundle App.roc
    - curl --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file bin/*.zst "${PACKAGE_REGISTRY_URL}/"
